[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seclog-sentinel"
version = "1.0.0"
description = "Web app and CLI that detect SSH brute-force, password-spraying and account-takeover patterns in auth logs, mapped to MITRE ATT&CK."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ghadi Alharthy" }]
keywords = ["security", "ssh", "log-analysis", "mitre-attack", "blue-team", "detection"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
dependencies = []

[project.optional-dependencies]
web = ["Flask>=3.0,<4", "gunicorn>=22.0"]

[project.scripts]
seclog = "seclog.cli:main"

[tool.setuptools]
packages = ["seclog", "seclog.web"]

[tool.setuptools.package-data]
"seclog.web" = ["templates/*.html", "static/*"]
